<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
.navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: rgba(25, 28, 31, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(89, 108, 110, 0.753);
        }

        .logo {
            position: absolute;
            left: 15px;
            top: 10px;
            width: 65px;
            height: 50px;
            object-fit: contain;
        }

        .nav-menu {
            display: flex;
            gap: 12px;
            list-style: none;
        }

        .nav-menu a {
            text-decoration: none;
            color: white;
            min-width: 120px;
            padding: 10px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-menu a:hover {
            background: linear-gradient(135deg, #2cc9e9, #324e96);
            border-color: #fff;
            box-shadow: 0 0 15px #25cfff, inset 0 0 10px rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }  
        /* HOME CAROUSEL */
        .carousel {
            width: 100%;
            height: 500px;
            position: fixed;
            overflow: fixed;
        }

        .slides {
            display: flex;
            width: 900%;
            height: 120%;
            animation: slide 32s infinite;
        }

        .slides img {
            width: 12.5%;
            height: 200%;
            object-fit: cover;
        }

        /* AUTOMATIC SLIDE */
        @keyframes slide {

            0%   { transform: translateX(0); }
            10%  { transform: translateX(0); }

            12%  { transform: translateX(-12.5%); }
            22%  { transform: translateX(-12.5%); }

            24%  { transform: translateX(-25%); }
            34%  { transform: translateX(-25%); }

       
        }

        /* TITLE */
        .title {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: white;
            text-align: center;

            text-shadow: 3px 5px 8px black;
        }

        .title h1 {
            font-size: 50px;
        }

        .title p {
            font-size: 18px;
        }


        @media (max-width: 800px) {
            .carousel {
                height: 350px;
            }

            .title h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

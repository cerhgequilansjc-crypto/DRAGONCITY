        .nav-menu a {
            text-decoration: none;
            color: white;
            min-width: 120px;
            padding: 10px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-menu a:hover {
            background: linear-gradient(135deg, #2cc9e9, #324e96);
            border-color: #fff;
            box-shadow: 0 0 15px #25cfff, inset 0 0 10px rgba(255,255,255,0.3);
            transform: translateY(-2px); 
            }

header {
    background: #071b2b;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 30px;
    font-weight: bold;
}
.carousel {
    width: 100%;
    max-width: 1800px;
    height: 670px;
    margin: 50px auto;
    overflow: hidden;
    border-radius: 20px;
}

.slider {
    display: flex;
    width: 600%;
    height: 100%;

    animation: slide 18s infinite;
}

.card {
    width: 16.666%;
    position: relative;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: fixed;
}

@keyframes slide {

    0% {
        transform: translateX(0);
    }

    15% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-16.666%);
    }

    35% {
        transform: translateX(-16.666%);
    }

    40% {
        transform: translateX(-33.333%);
    }

    55% {
        transform: translateX(-33.333%);
    }

    60% {
        transform: translateX(-50%);
    }

    75% {
        transform: translateX(-50%);
    }

    80% {
        transform: translateX(-66.666%);
    }

    95% {
        transform: translateX(-66.666%);
    }

    100% {
        transform: translateX(0);
    }
}
